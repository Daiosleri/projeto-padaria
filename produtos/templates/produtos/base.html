<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padaria - Sistema de Administração</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar {
            min-height: 100vh;
            background-color: #8B4513;
            padding-top: 20px;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px 20px;
        }
        .sidebar a:hover { background-color: #6B3410; }
        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
            padding: 10px 20px 20px;
            border-bottom: 1px solid #6B3410;
            margin-bottom: 10px;
        }
        .content { padding: 30px; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <div class="logo">🥐 Padaria</div>
            <a href="/"><i class="bi bi-house"></i> Início</a>
            <a href="/produtos/"><i class="bi bi-basket"></i> Produtos</a>
            <a href="/admin/"><i class="bi bi-gear"></i> Admin</a>
        </div>
        <div class="col-md-10 content">
            {% block content %}
            {% endblock %}
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
