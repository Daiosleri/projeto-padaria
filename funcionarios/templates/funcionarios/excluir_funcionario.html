{% extends 'produtos/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>🗑️ Excluir Funcionario</h2>
    <a href="/funcionarios/" class="btn btn-secondary">← Voltar</a>
</div>

<div class="card shadow">
    <div class="card-body text-center">
        <h4 class="mb-4">Tem certeza que deseja excluir o funcionario abaixo?</h4>
        <p class="fs-5"><strong>{{ funcionario.nome }}</strong></p>
        <p>Cargo: {{ funcionario.get_cargo_display }}</p>
        <p>Turno: {{ funcionario.get_turno_display }}</p>
        <form method="post">
            {% csrf_token %}
            <a href="/funcionarios/" class="btn btn-secondary me-3">❌ Cancelar</a>
            <button type="submit" class="btn btn-danger">🗑️ Confirmar Exclusao</button>
        </form>
    </div>
</div>
{% endblock %}
